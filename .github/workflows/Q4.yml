
name: Q4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer l'archive
        run: |
          DATE=$(date +%d-%m-%Y)
          FICHIER="Q4_archive_${DATE}.txt"

          echo "Nom : Kessin" > "$FICHIER"
          echo "Prenom : Bleou" >> "$FICHIER"
          cat Q4.java >> "$FICHIER"

      - name: Pousser l'archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q4_archive_*.txt
          git diff --cached --quiet || (git commit -m "Archive Q4" && git push)
