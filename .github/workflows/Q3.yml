
name: Q3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer l'archive
        run: |
          echo "Nom : Kessin" > Q3_archive_java.txt
          echo "Prenom : Bleou" >> Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt

      - name: Pousser l'archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q3_archive_java.txt
          git diff --cached --quiet || (git commit -m "Archive Q3" && git push)
