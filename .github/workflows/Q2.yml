
name: Q2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer Q2_archive_XYZ.txt
        run: |
          echo "Nom : Bleou" > Q2_archive_XYZ.txt
          echo "Prenom : Kessin" >> Q2_archive_XYZ.txt
          echo "Date et heure : $(date '+%d/%m/%Y %H:%M:%S')" >> Q2_archive_XYZ.txt
          echo "Contenu de XYZ.txt :" >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          echo "" >> Q2_archive_XYZ.txt
          echo "Taille de XYZ.txt : $(wc -c < XYZ.txt) octets" >> Q2_archive_XYZ.txt

      - name: Pousser le fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q2_archive_XYZ.txt
          git diff --cached --quiet || (git commit -m "Archive Q2" && git push)
